name: Bug report
description: Something doesn't work as expected
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting! Please check [Troubleshooting](https://github.com/devleloper/Pointwise/blob/main/docs/TROUBLESHOOTING.md) first.
        For security or privacy issues, use [private reporting](https://github.com/devleloper/Pointwise/security/advisories/new) instead.
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Turn on Smooth scrolling
        2. Open Safari
        3. Spin the wheel quickly
    validations:
      required: true
  - type: input
    id: mouse
    attributes:
      label: Mouse model and connection
      placeholder: Logitech MX Master 3S via Bolt receiver, generic USB mouse, …
    validations:
      required: true
  - type: input
    id: apps
    attributes:
      label: Affected apps
      placeholder: Safari, Chrome, Xcode, a game …
  - type: input
    id: pointwise-version
    attributes:
      label: Pointwise version
      description: Settings › General › Version
    validations:
      required: true
  - type: input
    id: macos-version
    attributes:
      label: macOS version
      placeholder: macOS 26.1 (25B78)
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: Accessibility access is granted (Settings › General › Permissions)
        - label: I also run another mouse or scroll utility (LinearMouse, Mac Mouse Fix, Logi Options+, BetterTouchTool, SteerMouse, …)
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Optional. Output of `log show --last 10m --predicate 'subsystem == "io.github.devleloper.Pointwise"'`. Pointwise never logs individual input events.
      render: text
